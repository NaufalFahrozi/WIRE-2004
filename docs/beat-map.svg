<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d"><title id="t">Where every bar of the song comes from</title><desc id="d">Bars 1 to 12, 27 to 38 and 61 to 72 play the source's last chorus straight through. Bars 13 to 20 and 39 to 54 loop one bar of music from just after it. Bars 21 to 26, 55 to 60 and 73 to 75 loop a two-bar sung phrase after that.</desc><rect width="1200" height="470" rx="14" fill="#140c0b"/><text x="60.0" y="44.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#f4ead6" text-anchor="start" >Every bar of the song, and where in the source it comes from</text><text x="60.0" y="68.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#b7a892" text-anchor="start" >All the sample in the record is cut from one minute of “Through the Fire”: its last chorus, and the bars after it.</text><text x="60.0" y="108.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#7d7265" text-anchor="start" letter-spacing="1">THROUGH THE FIRE · Chaka Khan · the source, 4:49</text><rect x="60" y="122" width="1080" height="10" rx="5" fill="#3a2b27"/><rect x="775.4" y="122" width="219.4" height="10" fill="#f4ead6"/><rect x="60.0" y="136" width="1" height="5" fill="#7d7265"/><text x="60.0" y="156.0" font-family="'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="400" fill="#7d7265" text-anchor="middle" >0:00</text><rect x="284.5" y="136" width="1" height="5" fill="#7d7265"/><text x="284.5" y="156.0" font-family="'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="400" fill="#7d7265" text-anchor="middle" >1:00</text><rect x="508.9" y="136" width="1" height="5" fill="#7d7265"/><text x="508.9" y="156.0" font-family="'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="400" fill="#7d7265" text-a