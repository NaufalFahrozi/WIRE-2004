<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d"><title id="t">Every chop is re-triggered on the grid</title><desc id="d">Line chart of the shift of each of the chorus's chops against an unbroken copy of the source, rising unevenly from zero at chop 1 to about 226 milliseconds.</desc><rect width="1200" height="420" rx="14" fill="#140c0b"/><text x="60.0" y="44.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#f4ead6" text-anchor="start" >Every chop is re-triggered on the grid</text><text x="60.0" y="68.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#b7a892" text-anchor="start" >How far each chorus chop sits from an unbroken copy of the source lined up on chop 1. The singers and players drift; the sampler pulls each chop back into time.</text><rect x="90" y="350.0" width="1050" height="1" fill="#3a2b27"/><text x="80.0" y="354.0" font-family="'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#7d7265" text-anchor="end" >0</text><rect x="90" y="302.0" width="1050" height="1" fill="#3a2b27"/><text x="80.0" y="306.0" font-family="'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#7d7265" text-anchor="end" >+50 ms</text><rect x="90" y="254.0" width="1050" height="1" fill="#3a2b27"/><text x="80.0" y="258.0" font-family="'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#7d7265" text-anchor="end" >+100 ms</text><rect x="90" y="206.0" width="1050" height="1" fill="#3a2b27"/><text x="80.0" y="210.0" font-family="'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#7d7265" text-anchor="end" >+150 ms</text><rect x="90" y="158.0" width="1050" height="1" fill="#3a2b27"/><text x="80.0" y="162.0" font-family="'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#7d7265" text-anchor="end" >+200 ms</text><rect x="90" y="110.0" width="1050" height="1" fill="#3a2b27"/><text x="80.0" y="114.0" font-family="'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#7d7265" text-anchor="end" >+250 ms</text><polyline points="111.9,350.0 155.6,300.3 199.4,318.6 243.1,336.7 286.9,247.6 330.6,265.6 374.4,257.1 418.1,274.6 461.9,237.5 505.6,248.6 549.4,230.1 593.1,230.0 636.9,229.9 680.6,207.1 724.4,190.5 768.1,207.9 811.9,154.8 855.6,154.5 899.4,152.4 943.1,133.3 986.9,155.1 1030.6,148.9 1074.4,141.1 1118.1,145.0" fill="none" stroke="#b8831c" stroke-width="2" stroke-linejoin="round"/><circle cx="111.9" cy="350.0" r="5" fill="#b8831c" stroke="#b8831c" stroke-width="2"/><text x="111.9" y="370.0" font-family="'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="400" fill="#7d7265" text-anchor="middle" >1</text><circle cx="155.6" cy="300.3" r="5" fill="#b8831c" stroke="#b8831c" stroke-width="2"/><text x="155.6" y="370.0" font-family="'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="400" fill="#7d7265" text-anchor="middle" >2</text><circle cx="199.4" cy="318.6" r="5" fill="#140c0b" stroke="#b8831c" stroke-width="2"/><text x="199.4" y="370.0" font-family="'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="400" fill="#7d7265" text-anchor="middle" >3</text><circle cx="243.1" cy="336.7" r="5" fill="#b8831c" stroke="#b8831c" stroke-width="2"/><text x="243.1" y="370.0" font-family="'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="400" fill="#7d7265" text-anchor="middle" >4</text><circle cx="286.9" cy="247.6" r="5" fill="#b8831c" stroke="#b8831c" stroke-width="2"/><text x="286.9" y="370.0" font-family="'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="400" fill="#7d7265" text-anchor="middle" >5</text><circle cx="33